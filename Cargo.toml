[package]
name = "iroh-testing"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
iroh = "1.5.0"
iroh-dns-server = "1.5.0"
iroh-relay = { version = "1.5.0", features = ["server"] }
iroh-tickets = "1.0.0"
n0-error = "1.0.3"
noq = "1.5.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
